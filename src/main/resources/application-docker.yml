spring:
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://user-service:8081
          predicates:
            - Path=/api/auth/**
        - id: user-service
          uri: http://user-service:8081
          predicates:
            - Path=/api/users/**
        - id: puzzle-service
          uri: http://puzzle-service:8082
          predicates:
            - Path=/api/puzzles/**
        - id: engine-service
          uri: http://engine-service:8083
          predicates:
            - Path=/api/engine/**
